name: Format plan data

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/format-plan.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pretty print plan.js
        run: python -c "import json,pathlib; p=pathlib.Path('plan.js'); s=p.read_text(encoding='utf-8').strip(); data=json.loads(s[len('window.P='):-1]); p.write_text('window.P='+json.dumps(data,ensure_ascii=False,indent=2)+';\n',encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan.js
          if ! git diff --cached --quiet; then
            git commit -m "format training plan data"
            git push
          fi
