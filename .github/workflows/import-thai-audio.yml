name: Import Thai Human Audio

on:
  push:
    branches:
      - feat/thai-native-swipe-official-audio
    paths:
      - .github/workflows/import-thai-audio.yml
      - tools/import_thai_audio.mjs
      - tools/materialize_thai_audio_archive.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/thai-native-swipe-official-audio
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Lingua Libre Thai language archive
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            https://lingualibre.org/datasets/Q136-tha-Thai.zip \
            -o /tmp/lingua-thai.zip
          mkdir -p /tmp/lingua-thai
          unzip -q /tmp/lingua-thai.zip -d /tmp/lingua-thai
          echo "Archive files: $(find /tmp/lingua-thai -type f | wc -l)"

      - name: Select exact open-license Thai recordings
        env:
          LINGUA_LIBRE_DATASET_DIR: /tmp/lingua-thai
        run: node tools/materialize_thai_audio_archive.mjs

      - name: Run Thai site tests
        working-directory: thai
        run: npm test

      - name: Commit generated audio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thai/audio/words thai/audio/sources.json thai/data/audio-map.js
          if git diff --cached --quiet; then
            echo "No generated audio changes"
          else
            git commit -m "chore: import open-license Thai human audio"
            git pull --rebase origin feat/thai-native-swipe-official-audio
            git push origin HEAD:feat/thai-native-swipe-official-audio
          fi
