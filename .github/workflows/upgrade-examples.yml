name: Upgrade examples and sentence quiz

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-examples.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upgrade page
        run: python tools/upgrade_examples.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "add example sentences and extended sentence quiz"
            git push
          fi
