name: Patch context quiz

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-context-quiz.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch context quiz
        run: python tools/patch_context_quiz.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "simplify sentence quiz to bilingual recall"
            git push
          fi
