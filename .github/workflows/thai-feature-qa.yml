name: Thai Feature QA

on:
  push:
    branches:
      - feat/thai-native-swipe-official-audio
    paths:
      - thai/**
      - tools/**
      - .github/workflows/thai-feature-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run all Thai tests
        working-directory: thai
        run: npm test

      - name: Check JavaScript syntax
        working-directory: thai
        run: find js data tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Assert direct swipe UI has no series arrow buttons
        run: |
          ! grep -R -n 'data-series-nav' thai/js thai/*.html
          ! grep -R -n '\.series-nav' thai/styles.css

      - name: Assert public Thai runtime contains no provider secret hooks
        run: |
          if grep -R -n -E 'API_KEY|aiforthai|api\.aiforthai' thai/js thai/data thai/*.html; then
            echo 'Unexpected provider/API-key reference in public Thai runtime'
            exit 1
          fi

      - name: Report local human audio coverage
        working-directory: thai
        run: |
          node --input-type=module -e "import { ENTRIES } from './data/index.js'; const n=ENTRIES.filter(x=>x.audio).length; console.log('Human word audio:', n, '/', ENTRIES.length); console.log('Device-TTS fallback:', ENTRIES.length-n, '/', ENTRIES.length);"
