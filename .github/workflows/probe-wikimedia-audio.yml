name: Probe Wikimedia Audio Download

on:
  push:
    branches:
      - feat/thai-native-swipe-official-audio
    paths:
      - .github/workflows/probe-wikimedia-audio.yml
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download known 11 KB Thai pronunciation file
        shell: bash
        run: |
          set -euxo pipefail
          url='https://upload.wikimedia.org/wikipedia/commons/1/1a/Th-cha.ogg'
          curl -fL --retry 2 --retry-all-errors --retry-delay 3 \
            -A 'ThaiLifeSpeakAudioImporter/1.0 (GitHub: succuvivi/english-deep-talk-plan)' \
            "$url" -o thai-cha.ogg
          size=$(wc -c < thai-cha.ogg | tr -d ' ')
          echo "downloaded_bytes=$size"
          test "$size" -gt 1000
